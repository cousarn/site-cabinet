# Déploiement du site sur OVH par Git (fonction « Associer Git » du multisite OVH).
#
# GitHub Actions construit le site, puis publie le dossier dist/ sur une branche de déploiement ;
# OVH, prévenu par webhook, tire cette branche dans le dossier du site. Aucun mot de passe FTP nulle part.
#
# - push sur `main`  → branche `deploy-preprod` → preprod.arnaudcousin-avocat.fr (dossier ./preprod, noindex)
# - tag `v*`         → branche `deploy-prod`    → arnaudcousin-avocat.fr          (dossier ./prod ; ./www = ancien site TOWeb, conservé)
#
# Côté OVH (une fois par environnement) : Hébergement › Multisite › ⋯ › Associer Git :
#   dépôt https://github.com/cousarn/site-cabinet.git (dépôt public → HTTPS, aucune clé),
#   branche deploy-preprod (ou deploy-prod), puis l'URL de webhook OVH dans
#   GitHub › Settings › Webhooks (content type application/json, événement push).
# NB : la clé SSH d'OVH est RSA 2048 bits ; GitHub refuse les clés RSA < 3072 bits depuis le 14/10/2026,
#   d'où le choix d'un dépôt public tiré en HTTPS. Aucun secret ne figure dans ce dépôt.

name: Déployer sur OVH

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}   # lancement manuel → préproduction

permissions:
  contents: write   # pour pousser les branches deploy-*

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Construire et publier
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preproduction' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Construire (préprod → noindex)
        run: npm run build
        env:
          PUBLIC_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'preprod' }}
      - name: Ajouter le marqueur de version
        run: echo "${{ github.sha }} $(date -u +%FT%TZ) ${{ github.ref_name }}" > dist/version.txt
      - name: Publier dist/ sur la branche de déploiement
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: ${{ startsWith(github.ref, 'refs/tags/v') && 'deploy-prod' || 'deploy-preprod' }}
          # Historique linéaire obligatoire : OVH fait un `git pull` dans son clone ; une branche
          # réécrite (force_orphan) ne peut plus avancer et la tâche OVH reste « En cours ».
          # Chaque déploiement est donc un commit de plus sur la branche (fast-forward côté OVH).
          force_orphan: false
          keep_files: false
          enable_jekyll: true   # pas de traitement Jekyll ; garde les fichiers commençant par un point (.htaccess)
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Déploiement ${{ github.ref_name }} — ${{ github.sha }}"
      # OVH refuse par intermittence les notifications de GitHub (401 « Client::Unauthorized » constaté
      # les 24 et 25/10/2026, alors que l'URL du webhook est bien celle fournie par OVH). Cette étape rend
      # l'échec visible : croix rouge et courriel de GitHub si le site n'affiche pas la nouvelle version.
      - name: Vérifier la mise en ligne (OVH a-t-il tiré la branche ?)
        env:
          CIBLE: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://arnaudcousin-avocat.fr' || 'https://preprod.arnaudcousin-avocat.fr' }}
        run: |
          for i in $(seq 1 24); do
            sleep 10
            if curl -fsS "$CIBLE/version.txt?v=$(date +%s)" | grep -q "$GITHUB_SHA"; then
              echo "En ligne : $CIBLE ($GITHUB_REF_NAME)"
              exit 0
            fi
          done
          echo "::error::$CIBLE n'affiche pas $GITHUB_SHA après 4 minutes : notification OVH probablement refusée. Remède : manager OVH › Hébergements › arnaudcousin-avocat.fr › Mes sites › ⋮ du site › Déployer Git (sans cocher « forcer »)."
          exit 1
